tron_edex:
  modes:
    dark:
      # core surfaces
      primary-background-color: "#000000"
      secondary-background-color: "#04090b"
      card-background-color: "#050f11"
      ha-card-background: "linear-gradient(135deg, #020a0c 0%, #061518 60%, #020a0c 100%)"
      clear-background-color: "#000000"
      app-header-background-color: "#000000"
      app-header-text-color: "#39f3ff"
      sidebar-background-color: "#000000"
      divider-color: "rgba(57, 243, 255, 0.22)"
      scrollbar-thumb-color: "#0f3338"

      # text
      primary-text-color: "#d6fbff"
      secondary-text-color: "#6fe3ef"
      disabled-text-color: "#3a5a5f"
      text-primary-color: "#01191c"
      error-color: "#ff5f6d"
      warning-color: "#ff9d2e"
      success-color: "#39f3ff"

      # brand
      primary-color: "#39f3ff"
      accent-color: "#ff9d2e"
      dark-primary-color: "#00b6c4"
      light-primary-color: "#8af9ff"
      rgb-primary-color: "57, 243, 255"
      rgb-accent-color: "255, 157, 46"
      rgb-disabled-color: "58, 90, 95"
      rgb-state-inactive-color: "58, 90, 95"
      rgb-card-background-color: "5, 15, 17"
      rgb-primary-background-color: "0, 0, 0"
      rgb-secondary-background-color: "4, 9, 11"

      # icons
      paper-item-icon-color: "#39f3ff"
      paper-item-icon-active-color: "#ff9d2e"
      state-icon-color: "#39f3ff"
      state-icon-active-color: "#ff9d2e"
      icon-color: "#39f3ff"

      # tile card
      tile-color: "#39f3ff"
      tile-icon-color: "#39f3ff"

      # switches / sliders / toggles
      switch-checked-color: "#39f3ff"
      switch-checked-button-color: "#39f3ff"
      switch-checked-track-color: "rgba(57, 243, 255, 0.35)"
      switch-unchecked-button-color: "#7fb3b8"
      switch-unchecked-track-color: "rgba(127, 179, 184, 0.3)"
      slider-color: "#39f3ff"
      slider-secondary-color: "rgba(57, 243, 255, 0.3)"
      label-badge-blue: "#39f3ff"

      # sidebar
      sidebar-icon-color: "#39f3ff"
      sidebar-text-color: "#d6fbff"
      sidebar-selected-icon-color: "#ff9d2e"
      sidebar-selected-text-color: "#ff9d2e"
      sidebar-selected-background-color: "rgba(255, 157, 46, 0.12)"

      # card shape/glow
      ha-card-border-radius: "6px"
      ha-card-border-width: "1px"
      ha-card-border-color: "rgba(57, 243, 255, 0.45)"
      ha-card-box-shadow: "0 0 8px rgba(57, 243, 255, 0.35), 0 0 22px rgba(57, 243, 255, 0.12)"

      # material design component fallbacks
      mdc-theme-primary: "#39f3ff"
      mdc-theme-secondary: "#ff9d2e"
      mdc-theme-on-primary: "#01191c"
      mdc-theme-surface: "#0a1416"
      mdc-theme-on-surface: "#d6fbff"
      mdc-theme-background: "#000000"
      mdc-theme-text-primary-on-background: "#d6fbff"
      mdc-theme-text-secondary-on-background: "#6fe3ef"
      mdc-theme-text-icon-on-background: "#39f3ff"
      mdc-theme-text-disabled-on-background: "#3a5a5f"

      # text fields / dropdowns
      mdc-text-field-fill-color: "#0a1416"
      mdc-text-field-ink-color: "#d6fbff"
      mdc-text-field-label-ink-color: "#6fe3ef"
      mdc-text-field-idle-line-color: "rgba(57, 243, 255, 0.35)"
      mdc-text-field-hover-line-color: "rgba(57, 243, 255, 0.6)"
      mdc-text-field-disabled-fill-color: "#04090b"
      mdc-select-fill-color: "#0a1416"
      mdc-select-ink-color: "#d6fbff"
      mdc-select-label-ink-color: "#6fe3ef"
      mdc-select-idle-line-color: "rgba(57, 243, 255, 0.35)"
      mdc-select-hover-line-color: "rgba(57, 243, 255, 0.6)"
      input-fill-color: "#0a1416"
      input-ink-color: "#d6fbff"
      input-label-ink-color: "#6fe3ef"
      input-idle-line-color: "rgba(57, 243, 255, 0.35)"
      input-hover-line-color: "rgba(57, 243, 255, 0.6)"
      input-disabled-fill-color: "#04090b"
      input-disabled-ink-color: "#3a5a5f"

      # dialogs / more-info / admin panels
      ha-dialog-surface-background: "#050f11"
      dialog-surface-background: "#050f11"
      mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.7)"
      more-info-header-background: "#000000"
      app-header-edit-background-color: "#000000"

      # data tables
      data-table-background-color: "#050f11"
      table-row-background-color: "#050f11"
      table-row-alternative-background-color: "#04090b"

    light:
      # Same Tron aesthetic in "light" mode too — this theme is intentionally
      # always dark, so light mode mirrors dark mode rather than inverting.
      primary-background-color: "#000000"
      secondary-background-color: "#04090b"
      card-background-color: "#050f11"
      ha-card-background: "linear-gradient(135deg, #020a0c 0%, #061518 60%, #020a0c 100%)"
      clear-background-color: "#000000"
      app-header-background-color: "#000000"
      app-header-text-color: "#39f3ff"
      sidebar-background-color: "#000000"
      divider-color: "rgba(57, 243, 255, 0.22)"
      primary-text-color: "#d6fbff"
      secondary-text-color: "#6fe3ef"
      disabled-text-color: "#3a5a5f"
      text-primary-color: "#01191c"
      primary-color: "#39f3ff"
      accent-color: "#ff9d2e"
      rgb-primary-color: "57, 243, 255"
      rgb-accent-color: "255, 157, 46"
      paper-item-icon-color: "#39f3ff"
      paper-item-icon-active-color: "#ff9d2e"
      state-icon-color: "#39f3ff"
      state-icon-active-color: "#ff9d2e"
      icon-color: "#39f3ff"
      tile-color: "#39f3ff"
      tile-icon-color: "#39f3ff"
      switch-checked-color: "#39f3ff"
      sidebar-icon-color: "#39f3ff"
      sidebar-text-color: "#d6fbff"
      sidebar-selected-icon-color: "#ff9d2e"
      sidebar-selected-text-color: "#ff9d2e"
      mdc-theme-primary: "#39f3ff"
      mdc-theme-secondary: "#ff9d2e"
      mdc-theme-surface: "#0a1416"
      mdc-theme-on-surface: "#d6fbff"
      mdc-text-field-fill-color: "#0a1416"
      mdc-text-field-ink-color: "#d6fbff"
      mdc-select-fill-color: "#0a1416"
      mdc-select-ink-color: "#d6fbff"
      input-fill-color: "#0a1416"
      input-ink-color: "#d6fbff"
      ha-dialog-surface-background: "#050f11"
      dialog-surface-background: "#050f11"
      data-table-background-color: "#050f11"
