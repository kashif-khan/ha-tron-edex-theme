name: Validate
on: [push, pull_request]
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with: {category: theme}
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml && python -c "import yaml,sys; yaml.safe_load(open('themes/tron_edex.yaml'))"
